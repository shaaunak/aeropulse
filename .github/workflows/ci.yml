name: AeroPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch NASA C-MAPSS dataset for CI testing
        run: |
          chmod +x scripts/fetch_cmapss.sh
          ./scripts/fetch_cmapss.sh data/raw

      - name: Run training & export checkpoint for API integration testing
        run: |
          PYTHONPATH=. python -m backend.train --epochs 2 --seed 42

      - name: Run backend pytest suite
        run: |
          PYTHONPATH=. pytest -v tests/

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production Build
        working-directory: frontend
        run: npm run build
